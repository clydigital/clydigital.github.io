name: Power Stack decision continuity checks
on:
  pull_request:
    paths:
      - 'power-stack/owner-decision-*.mjs'
      - 'power-stack/owner-decision-*.css'
      - 'power-stack/owner-framework-*.mjs'
      - 'power-stack/auth-gate.mjs'
      - 'power-stack/ideas.html'
      - 'power-stack/owner-ideas-*.mjs'
      - 'power-stack/owner-entry-plans.mjs'
      - 'power-stack/owner-visual-icons.mjs'
      - 'power-stack/owner-visual-hierarchy.css'
      - 'power-stack/scripts/test-visual-hierarchy.mjs'
      - 'power-stack/scripts/test-entry-plans.mjs'
      - 'power-stack/owner-ideas.css'
      - 'power-stack/owner-opportunity-terminal.mjs'
      - 'power-stack/owner-radar-workspace.mjs'
      - 'power-stack/owner-research-review.mjs'
      - 'power-stack/owner-calm-layout.css'
      - 'power-stack/scripts/test-research-review.mjs'
      - 'power-stack/owner-radar-workspace.css'
      - 'power-stack/owner-tavern-guildhall.css'
      - 'power-stack/owner-tavern-sitewide.css'
      - 'power-stack/scripts/test-tavern-sitewide.mjs'
      - 'power-stack/*.html'
      - 'power-stack/assets/tavern/**'
      - 'power-stack/scripts/test-radar-workspace.mjs'
      - 'power-stack/scripts/price-technicals.mjs'
      - 'power-stack/scripts/test-technicals.mjs'
      - 'power-stack/owner-opportunity-terminal.css'
      - 'power-stack/scripts/test-opportunity-terminal.mjs'
      - 'power-stack/owner-advisor-presentation.mjs'
      - 'power-stack/owner-advisor-theme.css'
      - 'power-stack/owner-fin-pulse.css'
      - 'power-stack/owner-angular-contrast.css'
      - 'power-stack/scripts/test-angular-contrast.mjs'
      - 'power-stack/private-gate.css'
      - 'power-stack/scripts/test-fin-pulse-theme.mjs'
      - 'power-stack/scripts/test-advisor-ui.mjs'
      - 'power-stack/owner-portfolio-table.mjs'
      - 'power-stack/owner-market-views.mjs'
      - 'power-stack/scripts/test-market-views.mjs'
      - 'power-stack/owner-portfolio-model.mjs'
      - 'power-stack/owner-portfolio.js'
      - 'power-stack/scripts/test-ideas.mjs'
      - 'power-stack/index.html'
      - 'power-stack/scripts/test-decision-continuity.mjs'
      - 'power-stack/scripts/test-decision-performance.mjs'
      - 'power-stack/scripts/test-framework-evidence.mjs'
      - 'power-stack/scripts/test-ideas.mjs'
      - 'power-stack/scripts/test-advisor-ui.mjs'
      - 'power-stack/owner-advisor-presentation.mjs'
      - 'power-stack/owner-advisor-theme.css'
      - 'power-stack/owner-fin-pulse.css'
      - 'power-stack/owner-angular-contrast.css'
      - 'power-stack/scripts/test-angular-contrast.mjs'
      - 'power-stack/scripts/test-fin-pulse-theme.mjs'
      - '.github/workflows/power-stack-decision-continuity.yml'
  push:
    branches: [main]
    paths:
      - 'power-stack/owner-decision-*.mjs'
      - 'power-stack/scripts/test-decision-continuity.mjs'
      - 'power-stack/scripts/test-decision-performance.mjs'
      - 'power-stack/owner-radar-workspace.mjs'
      - 'power-stack/owner-research-review.mjs'
      - 'power-stack/owner-calm-layout.css'
      - 'power-stack/scripts/test-research-review.mjs'
      - 'power-stack/owner-radar-workspace.css'
      - 'power-stack/owner-tavern-guildhall.css'
      - 'power-stack/owner-tavern-sitewide.css'
      - 'power-stack/scripts/test-tavern-sitewide.mjs'
      - 'power-stack/*.html'
      - 'power-stack/assets/tavern/**'
      - 'power-stack/scripts/test-radar-workspace.mjs'
permissions:
  contents: read
jobs:
  decision-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse source
        run: |
          node --check power-stack/owner-decision-core.mjs
          node --check power-stack/owner-decision-performance.mjs
          node --check power-stack/owner-decision-desk.mjs
          node --check power-stack/owner-framework-evidence.mjs
          node --check power-stack/owner-framework-view.mjs
          node --check power-stack/auth-gate.mjs
          node --check power-stack/owner-entry-plans.mjs
          node --check power-stack/owner-visual-icons.mjs
          node --check power-stack/owner-ideas-core.mjs
          node --check power-stack/owner-ideas-tracker.mjs
          node --check power-stack/owner-opportunity-terminal.mjs
          node --check power-stack/owner-radar-workspace.mjs
          node --check power-stack/owner-research-review.mjs
          node --check power-stack/scripts/price-technicals.mjs
          node --check power-stack/owner-portfolio-table.mjs
          node --check power-stack/owner-market-views.mjs
          node --check power-stack/owner-portfolio-model.mjs
          node --check power-stack/owner-portfolio.js
          node --check power-stack/owner-advisor-presentation.mjs
      - name: Decision reasoning regression
        run: node --test power-stack/scripts/test-decision-continuity.mjs power-stack/scripts/test-decision-performance.mjs power-stack/scripts/test-ideas.mjs power-stack/scripts/test-entry-plans.mjs power-stack/scripts/test-visual-hierarchy.mjs power-stack/scripts/test-advisor-ui.mjs power-stack/scripts/test-fin-pulse-theme.mjs power-stack/scripts/test-angular-contrast.mjs power-stack/scripts/test-framework-evidence.mjs power-stack/scripts/test-market-views.mjs power-stack/scripts/test-opportunity-terminal.mjs power-stack/scripts/test-technicals.mjs power-stack/scripts/test-radar-workspace.mjs power-stack/scripts/test-research-review.mjs power-stack/scripts/test-tavern-sitewide.mjs
      - name: Public asset privacy smoke
        shell: bash
        run: |
          if grep -El 'sb_secret_|service_role|leeyanghere@gmail.com|"owner_user_id":|"cash_delta":' power-stack/owner-decision-*.mjs; then
            echo "Owner data or sensitive key detected in public client asset"; exit 1
          fi
          test -f power-stack/owner-decision-desk.css
          test -f power-stack/ideas.html
          test -f power-stack/owner-ideas.css
          test -f power-stack/owner-opportunity-terminal.css
          test -f power-stack/owner-opportunity-terminal.mjs
          test -f power-stack/owner-radar-workspace.mjs
          test -f power-stack/owner-radar-workspace.css
          test -f power-stack/owner-tavern-guildhall.css
          test -f power-stack/owner-tavern-sitewide.css
          test -f power-stack/assets/tavern/tavern-room-guildhall-1400.webp
          test -f power-stack/owner-fin-pulse.css
          test -f power-stack/owner-angular-contrast.css
          test -f power-stack/owner-visual-hierarchy.css
          test -f power-stack/owner-visual-icons.mjs
          test -f power-stack/owner-market-views.mjs
          if grep -El 'sb_secret_|service_role|leeyanghere@gmail.com' power-stack/owner-fin-pulse.css power-stack/owner-advisor-presentation.mjs; then
            echo "Sensitive content in owner-neutral theme"; exit 1
          fi
          if grep -El 'sb_secret_|service_role|leeyanghere@gmail.com|brokerQuantity' power-stack/owner-ideas-*.mjs power-stack/ideas.html; then
            echo "Sensitive owner data in public ideas files"; exit 1
          fi
          grep -q 'PAGE==="index"' power-stack/auth-gate.mjs
          grep -q 'owner-decision-desk.css' power-stack/index.html
